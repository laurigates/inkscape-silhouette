name: Release

on:
  push:
    branches:
      - demo/release-please  # demo only: this is `main` in the real setup

jobs:
  release-please:
    name: Maintain the release PR, create the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
    - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
      id: release
      with:
        target-branch: ${{ github.ref_name }}

  package:
    name: Create Release Package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: 🐧 Install Inkscape
      run: |
        sudo add-apt-repository ppa:inkscape.dev/stable -y  # inkscape STABLE from https://launchpad.net/~inkscape.dev/+archive/ubuntu/stable
        sudo apt-get update
        sudo apt-get -y install inkscape
        sudo apt-get -y install gettext  # translation with msgfmt
        sudo apt-get -y install libxml-xpath-perl  # xpath
        inkscape --version
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Read versions
      id: versions
      env:
        TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      run: |
        echo TAG_VERSION=${TAG_NAME#v} >> $GITHUB_OUTPUT
        echo SOURCE_VERSION=$( python ./sendto_silhouette.py --version ) >> $GITHUB_OUTPUT
        echo INX_VERSION=$( xpath -q -e '//*[@name="about_version"]/text()' sendto_silhouette.inx | sed -e 's/^version //i' ) >> $GITHUB_OUTPUT
    - name: Version Check
      env:
          TAG_VERSION: ${{ steps.versions.outputs.TAG_VERSION }}
          SOURCE_VERSION: ${{ steps.versions.outputs.SOURCE_VERSION }}
          INX_VERSION: ${{ steps.versions.outputs.INX_VERSION }}
      run: |
          echo "::notice::tag version: $TAG_VERSION"
          echo "::notice::source version: $SOURCE_VERSION"
          echo "::notice::inx version: $INX_VERSION"
          [ "$SOURCE_VERSION" == "$INX_VERSION" ] || ( echo "::error::Error: source version and .inx version differ" && exit 1 )
          [ "$SOURCE_VERSION" == "$TAG_VERSION" ] || ( echo "::error::Error: source version and git tag differ" && exit 1 )
    - name: Build Release Package
      run: |
        make dist
    - name: Attach packages to the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      run: |
        gh release upload "$TAG_NAME" distribute/out/*
